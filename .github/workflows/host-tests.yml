# Host unit tests of the MCU-independent code (BaseCan v2 frame type, the
# lock-free RX ring used by EspCan). See tests/host/CMakeLists.txt.
#
# "Host tests gate" is the single check of this workflow to require; a job
# that was skipped counts as passed.
name: Host tests

on:
  pull_request:
  push:
    branches: [main, 'release/*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    name: Host tests (${{ matrix.compiler }}${{ matrix.sanitize && format(', {0}', matrix.sanitize) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            sanitize: ""
          - compiler: clang
            cxx: clang++
            sanitize: ""
          - compiler: gcc
            cxx: g++
            sanitize: address
          - compiler: clang
            cxx: clang++
            sanitize: thread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
          SANITIZE: ${{ matrix.sanitize }}
        run: cmake -S tests/host -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug -DHF_HOST_SANITIZE="${SANITIZE}"

      - name: Build
        run: cmake --build build/host

      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  gate:
    name: Host tests gate
    if: always()
    needs:
      - host
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Everything passed, or was skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          filter='[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key]'
          bad="$(jq -r "${filter} | join(\" \")" <<< "$RESULTS")"
          if [ -n "$bad" ]; then
            echo "Failed: $bad"
            exit 1
          fi
          echo "All host test jobs passed."
